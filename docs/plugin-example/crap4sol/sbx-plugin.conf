# sbx-plugin.conf for crap4sol: a sample for the tool's author to put at the repo root.
# claude-sandbox installs it with: sbx plugins <name> add https://github.com/anilhelvaci/crap4sol
name      = crap4sol
stack     = solidity
# uv isn't in the sandbox image: install it under {prefix} too, then crap4sol's own installer.
# {prefix} is read-only in the fleet; solc-select (via Slither) writes .venv/.solc-select,
# so point that at the writable {state}.
install   = curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR={prefix}/bin INSTALLER_NO_MODIFY_PATH=1 sh && ./install.sh {prefix}/bin && ln -sfn {state}/solc-select .venv/.solc-select
# Only the cycle's changed src/*.sol files (crap4sol takes paths); nothing changed -> pass.
# crap4sol leaves lcov.info behind, which would fail the next 'gate clean': remove it.
run       = mkdir -p {state}/solc-select; files=$(printf '%s\n' {changed} | grep -E '^src/.*\.sol$' || true); if [ -z "$files" ]; then echo "no src/*.sol changes"; exit 0; fi; crap4sol $files; rc=$?; rm -f lcov.info; exit $rc
allowlist = binaries.soliditylang.org
exit.1    = error
exit.2    = finding
exit.3    = error
brief     = BRIEF.sbx.md
